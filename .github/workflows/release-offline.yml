name: Release offline HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test
        run: node --test tests/*.test.js
      - name: Build offline HTML
        run: node scripts/build-offline.mjs
      - name: Publish release with offline HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="main-${GITHUB_RUN_NUMBER}"
          asset=dist/molybdenum-offline.html
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "$asset" --clobber
              gh release edit "$tag" --draft=false
            else
              echo "Release $tag is already published."
            fi
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Offline portfolio built from main commit $GITHUB_SHA. Download molybdenum-offline.html and open it in a browser."
          fi
